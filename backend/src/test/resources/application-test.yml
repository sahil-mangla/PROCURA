server:
  port: 8080

spring:
  application:
    name: procura-backend-test
  datasource:
    url: jdbc:h2:mem:procuratest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  flyway:
    enabled: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

security:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-seconds: 86400
  service-key: procura-internal-service-key-2026

procura:
  ai:
    service-url: http://localhost:8000
    mock-enabled: true
    timeout-seconds: 15
    retry-attempts: 1
  workflow:
    high-value-threshold: 50000.00
    confidence-threshold: 0.80
